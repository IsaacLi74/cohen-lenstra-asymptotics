name: Reproduce statistics
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      extend_to_2p30:
        description: Rebuild with LMFDB shards 0 through 3
        type: boolean
        default: false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ zlib1g-dev
          python -m pip install -r requirements.txt
      - name: Test mathematics, scanner parity, and count identities
        run: python -m pytest -q
      - name: Download LMFDB shards and rebuild through 2^30
        if: inputs.extend_to_2p30
        run: |
          bash scripts/fetch_extended_shards.sh
          python -m scripts.reproduce --rebuild --raw-xmax 1073741824
      - name: Reproduce all fits and plots from committed summaries
        if: "!inputs.extend_to_2p30"
        run: python -m scripts.reproduce
      - uses: actions/upload-artifact@v4
        with:
          name: reproduced-fits-and-plots
          path: |
            results/
            figures/statistics/
      - uses: actions/upload-artifact@v4
        if: inputs.extend_to_2p30
        with:
          name: sylow3-counts-2p30
          path: data/processed/
