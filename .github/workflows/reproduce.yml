name: Reproduce statistics
on: [push, pull_request, workflow_dispatch]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ zlib1g-dev
          python -m pip install -r requirements.txt
      - name: Test mathematics, scanner parity, and count identities
        run: python -m pytest -q
      - name: Reproduce all fits and plots from committed summaries
        run: python -m scripts.reproduce
      - uses: actions/upload-artifact@v4
        with:
          name: reproduced-fits-and-plots
          path: |
            results/
            figures/statistics/
